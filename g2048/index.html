<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#eef3f0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>奶蛙 2048</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    overscroll-behavior: none;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: #1c2b23;
    background: radial-gradient(120% 80% at 50% 0%, #f7fbf8 0%, #e7efe9 100%);
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
    touch-action: manipulation;
  }

  .app {
    --app-w: 402px;              /* 版心宽度：固定值，屏幕再宽也不拉伸 */
    width: var(--app-w);
    max-width: 100%;
    height: 100vh;
    height: 100dvh;
    margin: 0 auto;
    padding: calc(6px + env(safe-area-inset-top)) 12px calc(8px + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  /* ---------- 顶部菜单栏 ---------- */
  .topbar {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 8px;
    flex: none;
  }

  .topbar .right {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }

  .icon-btn {
    width: 40px;
    height: 40px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    border: 1px solid #dde8e1;
    border-radius: 13px;
    background: #ffffff;
    color: #2f4a3c;
    box-shadow: 0 2px 6px rgba(31, 74, 55, 0.06);
    transition: transform .08s ease, background .15s ease;
    cursor: pointer;
  }
  .icon-btn:active { transform: scale(0.92); background: #f1f6f3; }
  .icon-btn > span { display: flex; align-items: center; justify-content: center; }
  .icon-btn svg { width: 21px; height: 21px; fill: none; stroke: currentColor;
                  stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; }
  .icon-btn .fill-icon { fill: currentColor; stroke: none; }

  .timer {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: .5px;
    font-variant-numeric: tabular-nums;
    color: #24463a;
    padding: 4px 14px;
    border-radius: 12px;
    background: rgba(255, 255, 255, .72);
  }

  /* ---------- 数据区 ---------- */
  .scores {
    flex: none;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
  }
  .score-card {
    display: flex;
    align-items: baseline;
    gap: 6px;
    min-width: 0;
  }
  .score-card.mid { justify-content: center; }
  .score-card.end { justify-content: flex-end; }
  .score-card .label {
    font-size: 12.5px;
    color: #7b9187;
    white-space: nowrap;
  }
  .score-card .value {
    font-size: 20px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    color: #1a9c63;
    line-height: 1.05;
  }
  .score-card .value.best { color: #ef7a35; }
  .score-card .value.left { color: #4a97e0; }

  /* ---------- 游戏窗口 ---------- */
  .board-wrap {
    flex: 1 1 auto;
    min-height: 0;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  #game {
    display: block;
    border-radius: 18px;
    background: #e7eee9;
    box-shadow: 0 8px 24px rgba(28, 70, 52, .10), 0 0 0 1px rgba(28, 70, 52, .06);
    touch-action: none;
  }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 18px;
    pointer-events: none;
    opacity: 0;
    transition: opacity .18s ease;
  }
  .overlay.show { opacity: 1; }
  .overlay.show .card { pointer-events: auto; }
  .overlay .card {
    max-width: 86%;
    padding: 20px 26px;
    border-radius: 18px;
    background: rgba(255, 255, 255, .92);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 10px 30px rgba(24, 60, 44, .16);
    text-align: center;
  }
  .overlay .c-title { font-size: 19px; font-weight: 800; margin-bottom: 6px; }
  .overlay .c-desc { font-size: 13.5px; line-height: 1.7; color: #6c8378; }
  .overlay .c-desc b { color: #1a9c63; font-size: 16px; }
  .overlay .c-desc .orange { color: #ef7a35; }
  .overlay .badge {
    display: inline-block;
    margin-bottom: 8px;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(135deg, #ffa63d, #f2691f);
  }
  .overlay .c-btn {
    margin-top: 14px;
    padding: 10px 26px;
    border: none;
    border-radius: 999px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(135deg, #26b878, #149b60);
    box-shadow: 0 6px 16px rgba(26, 156, 99, .28);
    cursor: pointer;
    transition: transform .08s ease;
  }
  .overlay .c-btn:active { transform: scale(0.95); }

  /* ---------- 底部方向键 ---------- */
  .pad {
    --ph: clamp(42px, 7vh, 54px);
    flex: none;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(2, var(--ph));
    gap: 8px;
    width: min(100%, 380px);
    margin: 2px auto 0;
  }
  .pad button {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    border: 1px solid #dbe6df;
    border-radius: 16px;
    background: linear-gradient(180deg, #ffffff, #f3f8f5);
    color: #2c6a4f;
    box-shadow: 0 3px 8px rgba(31, 74, 55, .07);
    transition: transform .07s ease, background .12s ease;
    cursor: pointer;
    touch-action: none;
  }
  .pad button:active {
    transform: scale(0.94);
    background: linear-gradient(180deg, #e9f5ee, #dcf0e5);
  }
  .pad button svg {
    width: 22px; height: 22px;
    fill: none; stroke: currentColor;
    stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round;
  }
  .pad .k-up    { grid-column: 2; grid-row: 1; }
  .pad .k-left  { grid-column: 1; grid-row: 2; }
  .pad .k-down  { grid-column: 2; grid-row: 2; }
  .pad .k-right { grid-column: 3; grid-row: 2; }

  /* ---------- 提示 ---------- */
  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(24px + env(safe-area-inset-bottom));
    transform: translate(-50%, 12px);
    padding: 9px 18px;
    border-radius: 999px;
    font-size: 13.5px;
    color: #fff;
    background: rgba(30, 48, 40, .88);
    opacity: 0;
    pointer-events: none;
    transition: opacity .22s ease, transform .22s ease;
    z-index: 99;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* 横屏矮屏：收窄按钮高度并把十字方向键压成一行，版心宽度不变 */
  @media (orientation: landscape) and (max-height: 520px) {
    .pad {
      --ph: 42px;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: var(--ph);
    }
    .pad .k-up    { grid-column: 1; grid-row: 1; }
    .pad .k-left  { grid-column: 2; grid-row: 1; }
    .pad .k-down  { grid-column: 3; grid-row: 1; }
    .pad .k-right { grid-column: 4; grid-row: 1; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- 菜单栏 -->
  <header class="topbar">
    <div class="left">
      <button class="icon-btn" id="btnBack" aria-label="返回">
        <svg viewBox="0 0 24 24"><path d="M15 4.5 7.5 12 15 19.5"/></svg>
      </button>
    </div>
    <div class="timer" id="timer">00:00</div>
    <div class="right">
      <button class="icon-btn" id="btnPause" aria-label="暂停">
        <span id="pauseIcon">
          <svg viewBox="0 0 24 24">
            <rect class="fill-icon" x="6.5" y="5" width="3.6" height="14" rx="1.4"/>
            <rect class="fill-icon" x="13.9" y="5" width="3.6" height="14" rx="1.4"/>
          </svg>
        </span>
      </button>
      <button class="icon-btn" id="btnReset" aria-label="重置">
        <svg viewBox="0 0 24 24">
          <path d="M20 12a8 8 0 1 1-2.6-5.9"/>
          <path d="M20 4.5V10h-5.2"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- 数据 -->
  <div class="scores">
    <div class="score-card">
      <span class="label">步数</span>
      <span class="value left" id="steps">0</span>
    </div>
    <div class="score-card mid">
      <span class="label">得分</span>
      <span class="value" id="score">0</span>
    </div>
    <div class="score-card end">
      <span class="label">最高</span>
      <span class="value best" id="best">0</span>
    </div>
  </div>

  <!-- 游戏窗口 -->
  <div class="board-wrap" id="boardWrap">
    <canvas id="game"></canvas>
    <div class="overlay" id="overlay">
      <div class="card" id="overlayCard"></div>
    </div>
  </div>

  <!-- 方向键 -->
  <div class="pad">
    <button class="k-up" id="btnUp" aria-label="上">
      <svg viewBox="0 0 24 24"><path d="M12 19.5V5.5"/><path d="M5.8 11.7 12 5.5l6.2 6.2"/></svg>
    </button>
    <button class="k-left" id="btnLeft" aria-label="左">
      <svg viewBox="0 0 24 24"><path d="M19.5 12h-14"/><path d="M11.7 5.8 5.5 12l6.2 6.2"/></svg>
    </button>
    <button class="k-down" id="btnDown" aria-label="下">
      <svg viewBox="0 0 24 24"><path d="M12 4.5v14"/><path d="M5.8 12.3 12 18.5l6.2-6.2"/></svg>
    </button>
    <button class="k-right" id="btnRight" aria-label="右">
      <svg viewBox="0 0 24 24"><path d="M4.5 12h14"/><path d="M12.3 5.8 18.5 12l-6.2 6.2"/></svg>
    </button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  /* ========== 元素 ========== */
  const canvas    = document.getElementById('game');
  const ctx       = canvas.getContext('2d');
  const boardWrap = document.getElementById('boardWrap');
  const overlay   = document.getElementById('overlay');
  const card      = document.getElementById('overlayCard');
  const scoreEl   = document.getElementById('score');
  const bestEl    = document.getElementById('best');
  const stepEl    = document.getElementById('steps');
  const timerEl   = document.getElementById('timer');
  const btnBack   = document.getElementById('btnBack');
  const btnPause  = document.getElementById('btnPause');
  const btnReset  = document.getElementById('btnReset');
  const pauseIcon = document.getElementById('pauseIcon');
  const toastEl   = document.getElementById('toast');
  const dirBtns   = {
    up:    document.getElementById('btnUp'),
    left:  document.getElementById('btnLeft'),
    down:  document.getElementById('btnDown'),
    right: document.getElementById('btnRight')
  };

  /* ========== 常量 ========== */
  const N         = 4;                    // 4 x 4 棋盘
  const GOAL      = 2048;                 // 达成目标
  const MOVE_MS   = 100;                  // 滑动补间时长
  const POP_MS    = 170;                  // 合并弹跳时长
  const BORN_MS   = 160;                  // 新块出现时长
  const SWIPE_MIN = 22;                   // 手势判定阈值（px）
  const STORE_KEY = 'g2048_best_score_v1';
  const FONT      = '-apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif';

  /* ===== 自定义数字图片（想换自己的图，改这一段就够了）=====
     命名规则：0.png ~ 9.png，一位数字一张图，透明背景。
     方块上的数值按位取图并排拼出来，例如 128 → 1.png + 2.png + 8.png。
     缺任意一位，该数值整体退回内置文字（不会报错、不会白屏）。 */
  const USE_IMAGES  = true;              // false = 全部用内置文字
  const IMG_DIR     = 'img/';            // 图片目录（相对 index.html）
  const IMG_EXTS    = ['png', 'jpg', 'jpeg', 'webp', 'svg'];
  const DIGIT_MAX_H = 0.74;              // 单字符最大高度 = 格子边长 × 该比例
  const DIGIT_MAX_W = 0.90;              // 整个数值最大宽度 = 格子边长 × 该比例

  /* 方块配色：浅绿 → 深绿 → 强调橙 → 辅助蓝。
     底色逐档加深（保证和 #f2f8f4 空格拉开），深底上的文字转白。 */
  const TILE_STYLE = {
    2:     { bg: '#dceee6', fg: '#5f8474' },
    4:     { bg: '#cbe7d6', fg: '#4a8368' },
    8:     { bg: '#b8dfc8', fg: '#2a8258' },
    16:    { bg: '#a0d5b8', fg: '#1b6b46' },
    32:    { bg: '#86c9a5', fg: '#12603e' },
    64:    { bg: '#5fbc8d', fg: '#0b5436' },
    128:   { bg: '#2aa76d', fg: '#ffffff' },
    256:   { bg: '#1a9c63', fg: '#ffffff' },
    512:   { bg: '#ef7a35', fg: '#ffffff' },
    1024:  { bg: '#e0651f', fg: '#ffffff' },
    2048:  { bg: '#cf5414', fg: '#ffffff' },
    4096:  { bg: '#2f7fd0', fg: '#ffffff' },
    8192:  { bg: '#6b5fd0', fg: '#ffffff' },
    16384: { bg: '#5a4fb5', fg: '#ffffff' }
  };
  const TILE_STYLE_MAX = { bg: '#5a4fb5', fg: '#ffffff' };

  function tileStyle(v) { return TILE_STYLE[v] || TILE_STYLE_MAX; }
  function fontSize(v, cell) {
    const n = String(v).length;
    if (n <= 2) return cell * 0.44;
    if (n === 3) return cell * 0.35;
    if (n === 4) return cell * 0.28;
    if (n === 5) return cell * 0.23;
    if (n === 6) return cell * 0.19;
    return cell * 0.16;
  }

  /* ========== 状态 ========== */
  const digitImg = [];         // digitImg[数字] = 已加载成功的 <img>；没加载到就是 undefined
  let grid      = [];          // grid[r][c] = tile 或 null
  let tiles     = [];          // 所有活动方块（含正在被吞掉的）
  let state     = 'ready';     // ready | running | paused | over
  let score     = 0;
  let best      = Number(localStorage.getItem(STORE_KEY) || 0);
  let steps     = 0;
  let elapsed   = 0;
  let lastTick  = 0;
  let sizeCss   = 300;
  let cell      = 60;
  let gap       = 8;
  let pad       = 8;
  let dpr       = 1;
  let uid       = 0;
  let won       = false;       // 本局是否已达成 2048
  let newRecord = false;
  let overAt    = 0;
  let lastShake = 0;

  bestEl.textContent = best;

  /* ========== 数字图片加载 ========== */
  // 依次尝试 png / jpg / …，先找到哪个用哪个；都找不到就留给文字兜底
  function tryLoadDigit(d, k) {
    if (k >= IMG_EXTS.length) return;
    const el = new Image();
    el.onload  = function () { digitImg[d] = el; render(performance.now()); };
    el.onerror = function () { tryLoadDigit(d, k + 1); };
    el.src = IMG_DIR + d + '.' + IMG_EXTS[k];
  }
  function loadDigits() {
    if (!USE_IMAGES) return;
    for (let d = 0; d <= 9; d++) tryLoadDigit(d, 0);
  }

  /* ========== 尺寸自适应 ========== */
  function resize() {
    const rect = boardWrap.getBoundingClientRect();
    const avail = Math.min(rect.width, rect.height);
    const size = Math.max(160, Math.floor(avail) - 2);
    sizeCss = size;
    // 棋盘均分：左右各一个 pad，格与格之间 3 个 gap
    gap  = Math.round(size * 0.028);
    pad  = gap;
    cell = (size - gap * (N + 1)) / N;
    dpr  = Math.min(window.devicePixelRatio || 1, 2.5);
    canvas.style.width  = size + 'px';
    canvas.style.height = size + 'px';
    canvas.width  = Math.round(size * dpr);
    canvas.height = Math.round(size * dpr);
    render(performance.now());
  }

  if (window.ResizeObserver) {
    new ResizeObserver(resize).observe(boardWrap);
  } else {
    window.addEventListener('resize', resize);
  }
  window.addEventListener('orientationchange', function () { setTimeout(resize, 250); });

  /* ========== 小工具 ========== */
  function fmt(ms) {
    const total = Math.floor(ms / 1000);
    const m = String(Math.floor(total / 60)).padStart(2, '0');
    const s = String(total % 60).padStart(2, '0');
    return m + ':' + s;
  }
  function rrect(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function easeOut(k) { return 1 - Math.pow(1 - k, 3); }

  // 手势位移 → 方向；不够长返回 null
  function dirFromDelta(dx, dy) {
    if (Math.abs(dx) < SWIPE_MIN && Math.abs(dy) < SWIPE_MIN) return null;
    if (Math.abs(dx) > Math.abs(dy)) return dx > 0 ? 'right' : 'left';
    return dy > 0 ? 'down' : 'up';
  }

  /* ========== 棋盘 ========== */
  function emptyGrid() {
    const g = [];
    for (let r = 0; r < N; r++) g.push(new Array(N).fill(null));
    return g;
  }

  // 每条线的坐标序列：索引 0 = 该方向上的「终点端」
  function linesFor(dir) {
    const out = [];
    if (dir === 'left' || dir === 'right') {
      for (let r = 0; r < N; r++) {
        const line = [];
        for (let i = 0; i < N; i++) {
          line.push([r, dir === 'left' ? i : N - 1 - i]);
        }
        out.push(line);
      }
    } else {
      for (let c = 0; c < N; c++) {
        const line = [];
        for (let i = 0; i < N; i++) {
          line.push([dir === 'up' ? i : N - 1 - i, c]);
        }
        out.push(line);
      }
    }
    return out;
  }

  // 把上一轮未播完的动画直接收敛，保证逻辑层永远干净
  function finishAnims() {
    const now = performance.now();
    const keep = [];
    for (let i = 0; i < tiles.length; i++) {
      const t = tiles[i];
      if (t.dying) continue;              // 被吞掉的块：直接移除
      t.srcR = t.r;
      t.srcC = t.c;
      // 连滑时新块可能还没露面：把出生点提到渐显中段，避免它从全透明重新闪一次
      if (t.bornAt > now) t.bornAt = now - BORN_MS * 0.5;
      keep.push(t);
    }
    tiles = keep;
  }

  // 向 dir 滑动；返回是否真的动了
  function move(dir) {
    if (state !== 'running') return false;
    finishAnims();
    const now = performance.now();
    const lines = linesFor(dir);
    let moved = false, gained = 0;

    for (let li = 0; li < lines.length; li++) {
      const coords = lines[li];
      const line = [];
      for (let i = 0; i < coords.length; i++) {
        const t = grid[coords[i][0]][coords[i][1]];
        if (t) line.push(t);
      }
      if (!line.length) continue;

      const placed = [];
      for (let i = 0; i < line.length; i++) {
        const t = line[i];
        const p = placed.length ? placed[placed.length - 1] : null;

        if (p && !p.mergedThis && p.v === t.v) {
          // 合并：p 留在原地翻倍，t 滑过去后被吞掉
          p.v *= 2;
          p.mergedThis = true;
          p.popAt = now;
          gained += p.v;
          t.dying = true;
          t.srcR = t.r; t.srcC = t.c;
          t.r = p.r;    t.c = p.c;
          t.moveT0 = now;
          moved = true;
        } else {
          const r = coords[placed.length][0], c = coords[placed.length][1];
          if (t.r !== r || t.c !== c) moved = true;
          t.srcR = t.r; t.srcC = t.c;
          t.r = r;      t.c = c;
          t.moveT0 = now;
          t.mergedThis = false;
          placed.push(t);
        }
      }
    }

    if (!moved) return false;

    // 用放置结果重建网格
    grid = emptyGrid();
    for (let i = 0; i < tiles.length; i++) {
      const t = tiles[i];
      if (t.dying) continue;
      grid[t.r][t.c] = t;
    }

    steps++;
    score += gained;
    stepEl.textContent = steps;
    scoreEl.textContent = score;
    if (score > best) {
      best = score;
      newRecord = true;
      localStorage.setItem(STORE_KEY, String(best));
      bestEl.textContent = best;
    }

    spawn(now);
    render(now);

    if (!won && maxValue() >= GOAL) reachGoal();
    if (!canMove()) gameOver();
    return true;
  }

  function maxValue() {
    let m = 0;
    for (let i = 0; i < tiles.length; i++) {
      const t = tiles[i];
      if (!t.dying && t.v > m) m = t.v;
    }
    return m;
  }

  function canMove() {
    for (let r = 0; r < N; r++) {
      for (let c = 0; c < N; c++) {
        const t = grid[r][c];
        if (!t) return true;
        if (c + 1 < N) { const q = grid[r][c + 1]; if (q && q.v === t.v) return true; }
        if (r + 1 < N) { const q = grid[r + 1][c]; if (q && q.v === t.v) return true; }
      }
    }
    return false;
  }

  function spawn(now) {
    const empty = [];
    for (let r = 0; r < N; r++) {
      for (let c = 0; c < N; c++) if (!grid[r][c]) empty.push([r, c]);
    }
    if (!empty.length) return null;
    const p = empty[Math.floor(Math.random() * empty.length)];
    const t = {
      id: ++uid,
      v: Math.random() < 0.9 ? 2 : 4,
      r: p[0], c: p[1],
      srcR: p[0], srcC: p[1],
      moveT0: -1,
      bornAt: now + MOVE_MS * 0.6,
      popAt: 0,
      dying: false,
      mergedThis: false
    };
    grid[t.r][t.c] = t;
    tiles.push(t);
    return t;
  }

  /* ========== 局面流程 ========== */
  function resetGame() {
    const now = performance.now();
    score = 0; steps = 0; elapsed = 0; uid = 0;
    won = false; newRecord = false; overAt = 0;
    grid = emptyGrid();
    tiles = [];
    scoreEl.textContent = '0';
    stepEl.textContent = '0';
    timerEl.textContent = '00:00';
    spawn(now);
    spawn(now);
    state = 'ready';
    setPauseIcon(false);
    showOverlay('ready');
    render(now);
  }

  function start() {
    if (state === 'running') return;
    if (state === 'over') resetGame();
    if (state === 'ready' || state === 'paused') {
      state = 'running';
      lastTick = performance.now();
    }
    hideOverlay();
    setPauseIcon(true);
  }

  function pause() {
    if (state !== 'running') return;
    state = 'paused';
    setPauseIcon(false);
    showOverlay('paused');
  }

  function togglePause() {
    if (state === 'running') pause();
    else start();
  }

  function reachGoal() {
    won = true;
    state = 'paused';
    setPauseIcon(false);
    showOverlay('win');
  }

  function gameOver() {
    state = 'over';
    overAt = performance.now();
    setPauseIcon(false);
    showOverlay('over');
  }

  /* ========== 渲染 ========== */
  // 按位并排的排版尺寸：h 为字符高、w 为整个数值的宽（ars 是各字符图的宽高比）
  function digitMetrics(ars, cellSize) {
    let sum = 0;
    for (let i = 0; i < ars.length; i++) sum += ars[i];
    const h = cellSize * Math.min(DIGIT_MAX_H, DIGIT_MAX_W / sum);
    return { h: h, w: h * sum };
  }

  // 在「已 translate 到格子中心」的坐标系里画出数值：优先用图片，缺图则整串退回文字
  function drawValue(v, fg) {
    const str = String(v);
    let imgs = null;
    if (USE_IMAGES) {
      imgs = [];
      for (let i = 0; i < str.length; i++) {
        const im = digitImg[+str[i]];
        if (!im) { imgs = null; break; }   // 任意一位没有图 → 整串退回文字，避免图字混排
        imgs.push(im);
      }
    }
    if (!imgs) {
      ctx.fillStyle = fg;
      ctx.font = '800 ' + fontSize(v, cell) + 'px ' + FONT;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(str, 0, cell * 0.03);
      return;
    }

    const ars = [];
    for (let i = 0; i < imgs.length; i++) {
      ars.push((imgs[i].naturalWidth || 1) / (imgs[i].naturalHeight || 1));
    }
    const m = digitMetrics(ars, cell);
    let x = -m.w / 2;
    for (let i = 0; i < imgs.length; i++) {
      const w = m.h * ars[i];
      ctx.drawImage(imgs[i], x, -m.h / 2, w, m.h);
      x += w;
    }
  }

  function drawTile(t, now) {
    let k = 1;
    if (t.srcR !== t.r || t.srcC !== t.c) {
      k = Math.max(0, Math.min(1, (now - t.moveT0) / MOVE_MS));
    }
    const e = easeOut(k);
    const fr = t.srcR + (t.r - t.srcR) * e;
    const fc = t.srcC + (t.c - t.srcC) * e;
    const x = pad + fc * (cell + gap);
    const y = pad + fr * (cell + gap);

    let scale = 1, alpha = 1;

    if (t.bornAt) {
      const bk = (now - t.bornAt) / BORN_MS;
      if (bk < 0) return;                                   // 还没到出场时间
      if (bk < 1) {
        const be = easeOut(bk);
        scale *= 0.45 + 0.55 * be;
        alpha *= Math.min(1, bk * 1.6);
      }
    }
    if (t.popAt) {
      const pk = (now - t.popAt) / POP_MS;
      if (pk >= 0 && pk < 1) scale *= 1 + 0.16 * Math.sin(Math.PI * pk);
    }
    if (t.dying && k >= 1) return;                          // 已被吞掉

    const st = tileStyle(t.v);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(x + cell / 2, y + cell / 2);
    ctx.scale(scale, scale);
    rrect(-cell / 2, -cell / 2, cell, cell, cell * 0.18);
    ctx.fillStyle = st.bg;
    ctx.fill();
    ctx.lineWidth = Math.max(1, cell * 0.022);   // 淡描边：让最浅的方块也能从空格里分出来
    ctx.strokeStyle = 'rgba(28,70,52,.09)';
    ctx.stroke();
    drawValue(t.v, st.fg);
    ctx.restore();
  }

  function render(now) {
    const w = sizeCss;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.imageSmoothingEnabled = true;          // 数字图片要缩得比较小，开高质量插值
    ctx.imageSmoothingQuality = 'high';
    ctx.clearRect(0, 0, w, w);

    // 棋盘底
    ctx.fillStyle = '#e7eee9';
    ctx.fillRect(0, 0, w, w);

    // 空格
    ctx.fillStyle = '#f2f8f4';
    for (let r = 0; r < N; r++) {
      for (let c = 0; c < N; c++) {
        rrect(pad + c * (cell + gap), pad + r * (cell + gap), cell, cell, cell * 0.18);
        ctx.fill();
      }
    }

    // 被吞掉的块画在下层，保证合并时新数字压在上面
    for (let i = 0; i < tiles.length; i++) if (tiles[i].dying) drawTile(tiles[i], now);
    for (let i = 0; i < tiles.length; i++) if (!tiles[i].dying) drawTile(tiles[i], now);
  }

  /* ========== 主循环 ========== */
  function loop(now) {
    requestAnimationFrame(loop);

    if (state === 'running') {
      const dt = Math.min(now - lastTick, 200);
      lastTick = now;
      elapsed += dt;
      timerEl.textContent = fmt(elapsed);
    } else {
      lastTick = now;
    }

    // 清理播完的「被吞掉」动画
    let hasDying = false;
    for (let i = 0; i < tiles.length; i++) {
      const t = tiles[i];
      if (t.dying && now - t.moveT0 >= MOVE_MS) { hasDying = true; break; }
    }
    if (hasDying) {
      const keep = [];
      for (let i = 0; i < tiles.length; i++) {
        const t = tiles[i];
        if (t.dying && now - t.moveT0 >= MOVE_MS) continue;
        keep.push(t);
      }
      tiles = keep;
    }

    render(now);
  }

  /* ========== 遮罩层 ========== */
  function showOverlay(type) {
    let html = '';
    if (type === 'ready') {
      html = '<div class="c-title">开始 2048</div>' +
             '<div class="c-desc">滑动屏幕或用<b>方向键</b>把数字推到一起<br>' +
             '相同的数字会<b>合并翻倍</b><br>' +
             '合出 <span class="orange">2048</span> 就算达成</div>';
    } else if (type === 'paused') {
      html = '<div class="c-title">已暂停</div>' +
             '<div class="c-desc">点击棋盘或按空格继续</div>';
    } else if (type === 'win') {
      html = '<div class="badge">目标达成</div>' +
             '<div class="c-title">合出 2048 了</div>' +
             '<div class="c-desc">当前得分 <b>' + score + '</b><br>' +
             '还想看看更大的数字吗？<br>继续冲 4096 也行</div>' +
             '<button class="c-btn" id="goOnBtn">继续挑战</button>';
    } else if (type === 'over') {
      html = (newRecord ? '<div class="badge">新纪录！</div>' : '') +
             '<div class="c-title">没有能合并的了</div>' +
             '<div class="c-desc">得分 <b>' + score + '</b>，最大数字 <b>' + maxValue() + '</b><br>' +
             '共走了 ' + steps + ' 步，用时 ' + fmt(elapsed) + '<br>' +
             '历史最高 <span class="orange">' + best + '</span></div>' +
             '<button class="c-btn" id="againBtn">再来一局</button>';
    }
    card.innerHTML = html;
    overlay.classList.add('show');

    const goOn = document.getElementById('goOnBtn');
    if (goOn) {
      goOn.addEventListener('click', function (e) { e.stopPropagation(); start(); });
    }
    const again = document.getElementById('againBtn');
    if (again) {
      again.addEventListener('click', function (e) {
        e.stopPropagation();
        resetGame();
        start();
      });
    }
  }
  function hideOverlay() { overlay.classList.remove('show'); }

  /* ========== 暂停按钮图标 ========== */
  const SVG_PAUSE =
    '<svg viewBox="0 0 24 24">' +
      '<rect class="fill-icon" x="6.5" y="5" width="3.6" height="14" rx="1.4"/>' +
      '<rect class="fill-icon" x="13.9" y="5" width="3.6" height="14" rx="1.4"/>' +
    '</svg>';
  const SVG_PLAY =
    '<svg viewBox="0 0 24 24">' +
      '<path class="fill-icon" d="M7.6 5.05a1.1 1.1 0 0 1 1.66-.95l9.1 5.35a1.1 1.1 0 0 1 0 1.9l-9.1 5.35a1.1 1.1 0 0 1-1.66-.95z"/>' +
    '</svg>';

  function setPauseIcon(playing) {
    pauseIcon.innerHTML = playing ? SVG_PAUSE : SVG_PLAY;
    btnPause.setAttribute('aria-label', playing ? '暂停' : '继续');
  }

  /* ========== 输入 ========== */
  // 无效方向给一点回弹反馈（节流，避免连续滑动时抖个不停）
  function shake(dir) {
    const now = performance.now();
    if (now - lastShake < 140) return;
    lastShake = now;
    if (!canvas.animate) return;
    const m = { up: [0, -5], down: [0, 5], left: [-5, 0], right: [5, 0] }[dir] || [0, 0];
    canvas.animate([
      { transform: 'translate(0,0)' },
      { transform: 'translate(' + m[0] + 'px,' + m[1] + 'px)' },
      { transform: 'translate(0,0)' }
    ], { duration: 170, easing: 'ease-out' });
  }

  function act(dir) {
    if (state === 'ready' || state === 'paused') { start(); return; }
    if (state !== 'running') return;
    if (!move(dir)) shake(dir);
  }

  let swipeX = 0, swipeY = 0, swiping = false;

  canvas.addEventListener('pointerdown', function (e) {
    if (state === 'ready' || state === 'paused') { start(); return; }
    if (state !== 'running') return;
    swiping = true;
    swipeX = e.clientX;
    swipeY = e.clientY;
    e.preventDefault();
  }, { passive: false });

  canvas.addEventListener('pointermove', function (e) {
    if (!swiping) return;
    const d = dirFromDelta(e.clientX - swipeX, e.clientY - swipeY);
    if (!d) return;
    swipeX = e.clientX;      // 支持一次按住连续滑好几步
    swipeY = e.clientY;
    act(d);
    e.preventDefault();
  }, { passive: false });

  canvas.addEventListener('pointerup', function (e) {
    if (!swiping) return;
    swiping = false;
    const d = dirFromDelta(e.clientX - swipeX, e.clientY - swipeY);
    if (d) act(d);
  });

  canvas.addEventListener('pointercancel', function () { swiping = false; });

  canvas.addEventListener('click', function () {
    if (state === 'ready' || state === 'paused') start();
    else if (state === 'over' && performance.now() - overAt > 700) { resetGame(); start(); }
  });

  card.addEventListener('click', function () {
    if (state === 'ready' || state === 'paused') start();
  });

  Object.keys(dirBtns).forEach(function (d) {
    dirBtns[d].addEventListener('pointerdown', function (e) {
      e.stopPropagation();
      e.preventDefault();
      act(d);
    }, { passive: false });
  });

  window.addEventListener('keydown', function (e) {
    const k = e.key;
    if (k === 'ArrowLeft'  || k === 'a' || k === 'A') { e.preventDefault(); act('left');  return; }
    if (k === 'ArrowRight' || k === 'd' || k === 'D') { e.preventDefault(); act('right'); return; }
    if (k === 'ArrowUp'    || k === 'w' || k === 'W') { e.preventDefault(); act('up');    return; }
    if (k === 'ArrowDown'  || k === 's' || k === 'S') { e.preventDefault(); act('down');  return; }
    if (k === ' ' || k === 'Enter') { e.preventDefault(); togglePause(); return; }
    if (k === 'r' || k === 'R') { resetGame(); toast('已重置'); return; }
    if (k === 'Escape' && state === 'running') pause();
  });

  btnPause.addEventListener('click', function (e) { e.stopPropagation(); togglePause(); });

  btnReset.addEventListener('click', function (e) {
    e.stopPropagation();
    resetGame();
    toast('已重置');
  });

  btnBack.addEventListener('click', function (e) {
    e.stopPropagation();
    /* 返回游戏主页 */
    window.location.href = '../index.html';
  });

  document.addEventListener('visibilitychange', function () {
    if (document.hidden && state === 'running') pause();
  });

  /* ========== 轻提示 ========== */
  let toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 1400);
  }

  /* ========== 启动 ========== */
  loadDigits();
  resetGame();
  resize();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
