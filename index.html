<style data-page-node-id="TH9cP3ey4Bi2WdUb3yCCvC">
  :root {
    --ink: #14342a;
    --ink2: #5b6f66;
    --ink3: #8b9d94;
    --line: rgba(31, 74, 58, .10);
    --card: rgba(255, 255, 255, .86);
    --shadow: 0 1px 2px rgba(24, 61, 48, .05), 0 10px 28px -14px rgba(24, 61, 48, .22);
    --shadow-hi: 0 2px 6px rgba(24, 61, 48, .07), 0 24px 46px -18px rgba(24, 61, 48, .32);
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: var(--ink);
    background: radial-gradient(120% 80% at 50% 0%, #f9fcfa 0%, #e7efe9 100%);
    background-attachment: fixed;
    -webkit-tap-highlight-color: transparent;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* 背景装饰光斑 */
  .bg { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .bg span {
    position: absolute; border-radius: 50%;
    filter: blur(70px);
    opacity: .5;
  }
  .bg .b1 { width: 320px; height: 320px; left: -90px; top: -80px; background: rgba(6, 182, 212, .22); }
  .bg .b2 { width: 300px; height: 300px; right: -100px; top: 12%;  background: rgba(34, 197, 94, .18); }
  .bg .b3 { width: 300px; height: 300px; left: 30%; bottom: -140px; background: rgba(244, 63, 94, .14); }

  .app {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
    padding: calc(28px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
  }

  /* ---------- 头部 ---------- */
  .hero { text-align: center; padding: 6px 0 24px; }

  .chip {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 12px; font-weight: 700; letter-spacing: .2px;
    color: #2f6d55;
    background: rgba(255, 255, 255, .82);
    border: 1px solid var(--line);
    padding: 6px 13px;
    border-radius: 999px;
    box-shadow: 0 1px 2px rgba(24, 61, 48, .04);
  }
  .chip i {
    width: 7px; height: 7px; border-radius: 50%;
    background: #34c77b;
    box-shadow: 0 0 0 3px rgba(52, 199, 123, .18);
  }

  h1 {
    margin: 16px 0 8px;
    font-size: clamp(27px, 8vw, 35px);
    font-weight: 900;
    letter-spacing: .5px;
    color: var(--ink);
  }

  .sub { margin: 0; font-size: 14px; color: var(--ink2); letter-spacing: .2px; }

  /* ---------- 卡片列表 ---------- */
  .grid { display: grid; grid-template-columns: 1fr; gap: 13px; }

  .card {
    --c1: #10b981;
    --csoft: rgba(16, 185, 129, .13);
    position: relative;
    display: flex;
    align-items: center;
    gap: 15px;
    padding: 15px 16px;
    border-radius: 22px;
    background: var(--card);
    border: 1px solid var(--line);
    box-shadow: var(--shadow);
    text-decoration: none;
    color: inherit;
    overflow: hidden;
    transition: transform .3s cubic-bezier(.22, 1, .36, 1),
                box-shadow .3s ease,
                border-color .3s ease;
    animation: rise .55s cubic-bezier(.22, 1, .36, 1) both;
  }
  .card:nth-child(1) { animation-delay: .05s; }
  .card:nth-child(2) { animation-delay: .12s; }
  .card:nth-child(3) { animation-delay: .19s; }

  .card::after {
    content: "";
    position: absolute; inset: 0;
    background: radial-gradient(120% 100% at 0% 50%, var(--csoft), transparent 62%);
    opacity: 0;
    transition: opacity .3s ease;
    pointer-events: none;
  }

  .card:hover, .card:focus-visible {
    transform: translateY(-4px);
    box-shadow: var(--shadow-hi);
    border-color: var(--c1);
    outline: none;
  }
  .card:hover::after, .card:focus-visible::after { opacity: .85; }
  .card:active { transform: translateY(-1px) scale(.988); }

  /* 图标 */
  .ico {
    position: relative;
    flex: none;
    width: 64px; height: 64px;
    border-radius: 19px;
    background: var(--csoft);
    display: grid; place-items: center;
    transition: transform .3s cubic-bezier(.22, 1, .36, 1);
  }
  .card:hover .ico { transform: scale(1.06) rotate(-2deg); }
  .ico svg { width: 52px; height: 52px; display: block; }

  /* 文字 */
  .meta { flex: 1; min-width: 0; }
  .name {
    font-size: 17px; font-weight: 800; letter-spacing: .3px;
    color: var(--ink);
    display: flex; align-items: center; gap: 8px;
  }
  .desc {
    margin-top: 4px;
    font-size: 13px;
    line-height: 1.5;
    color: var(--ink2);
  }
  .tags { margin-top: 9px; display: flex; flex-wrap: wrap; gap: 6px; }
  .tag {
    font-size: 11px; font-weight: 700;
    color: var(--c1);
    background: var(--csoft);
    padding: 3px 9px;
    border-radius: 999px;
    letter-spacing: .2px;
  }

  /* 进入箭头 */
  .go {
    flex: none;
    width: 34px; height: 34px;
    margin-left: auto;
    border-radius: 50%;
    display: grid; place-items: center;
    background: var(--csoft);
    color: var(--c1);
    transition: transform .3s cubic-bezier(.22, 1, .36, 1);
  }
  .go svg { width: 17px; height: 17px; }
  .card:hover .go { transform: translateX(3px); }

  /* ---------- 底部 ---------- */
  .foot {
    margin-top: 22px;
    text-align: center;
    font-size: 12px;
    color: var(--ink3);
    letter-spacing: .2px;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: none; }
  }

  /* ---------- 宽屏：三张卡片并排 ---------- */
  @media (min-width: 720px) {
    .app { padding-top: calc(48px + env(safe-area-inset-top)); }
    .hero { padding-bottom: 32px; }
    .grid { grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .card {
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 15px;
      padding: 26px 18px 22px;
    }
    .ico { width: 86px; height: 86px; border-radius: 25px; }
    .ico svg { width: 68px; height: 68px; }
    .name { justify-content: center; font-size: 18px; }
    .desc { font-size: 13.5px; }
    .tags { justify-content: center; }
    .go { margin-left: 0; width: 38px; height: 38px; }
    .card:hover .go { transform: translateY(3px); }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
